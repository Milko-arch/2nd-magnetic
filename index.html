// Magnetic interaction model: correct facing poles, pointer dragging, spring/damping and field effects.
function createMagnetPhysics(canvas,configuration,isLab=false){
const W=850,H=420,magW=206,magH=70,leftX=122,leftY=165;
let x=520,v=0,drag=false,dragOffset=0,lastPointer=0,lastX=x,burst=0;
canvas.width=W;canvas.height=H;canvas.style.cursor="grab";
const cfg=()=>typeof configuration==="function"?configuration():configuration;
const getPoles=()=>{let m=cfg();return m==="NN"?["S","N","N","S"]:m==="SS"?["N","S","S","N"]:["N","S","N","S"]};
const point=e=>{let r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}};
canvas.addEventListener("pointerdown",e=>{let p=point(e);if(p.x>=x-20&&p.x<=x+magW+20&&p.y>=leftY-25&&p.y<=leftY+magH+25){drag=true;dragOffset=p.x-x;lastPointer=performance.now();lastX=x;canvas.setPointerCapture(e.pointerId);canvas.style.cursor="grabbing"}});
canvas.addEventListener("pointermove",e=>{if(!drag)return;let p=point(e);let nx=Math.max(leftX+magW+6,Math.min(W-magW-20,p.x-dragOffset));let now=performance.now();v=Math.max(-16,Math.min(16,(nx-lastX)*16/Math.max(10,now-lastPointer)));x=nx;lastX=x;lastPointer=now});
const release=e=>{if(drag){drag=false;canvas.style.cursor="grab";burst=28}};
canvas.addEventListener("pointerup",release);canvas.addEventListener("pointercancel",release);
function reset(){x=520;v=0;burst=0}
function message(){let poles=getPoles(),same=poles[1]===poles[2];return same?`Like poles (${poles[1]} and ${poles[2]}) repel: move them close and watch them push apart.`:`Unlike poles (${poles[1]} and ${poles[2]}) attract: move them close and watch them pull together.`}
function paint(ctx,t){let poles=getPoles(),same=poles[1]===poles[2],gap=x-(leftX+magW),closeness=Math.max(0,1-Math.max(0,gap)/360);
if(!drag){let force=(same?1:-1)*(0.16+2.6*closeness*closeness);if(!same&&gap<7){x=leftX+magW+6;v=0}else{v=(v+force)*.94;x=Math.max(leftX+magW+6,Math.min(W-magW-20,x+v));if(x===W-magW-20)v=0}}
ctx.save();ctx.strokeStyle="#3a7b9a";ctx.lineWidth=2;ctx.setLineDash([5,9]);ctx.beginPath();ctx.moveTo(leftX+magW+8,leftY+magH/2);ctx.lineTo(x-8,leftY+magH/2);ctx.stroke();ctx.setLineDash([]);
for(let k=0;k<12;k++){let a=k*Math.PI/6+t*.002;ctx.strokeStyle=`rgba(${same?'255,151,130':'73,236,207'},${.13+closeness*.5})`;ctx.lineWidth=1.4;ctx.beginPath();let sx=leftX+magW-10,sy=leftY+magH/2;let ex=x+10,ey=sy;let bend=Math.sin(a)*Math.min(155,gap*.5+30);ctx.moveTo(sx,sy);ctx.bezierCurveTo(sx+Math.max(20,gap*.2),sy+bend,ex-Math.max(20,gap*.2),ey+bend,ex,ey);ctx.stroke()}
drawMag(ctx,leftX,leftY,magW,magH,poles[0],poles[1]);drawMag(ctx,x,leftY,magW,magH,poles[2],poles[3]);
ctx.textAlign="center";ctx.font="bold 28px system-ui";ctx.fillStyle=same?"#ffae86":"#70ffe1";ctx.fillText(same?"↤  REPEL  ↦":"→  ATTRACT  ←",(leftX+magW+x)/2,leftY-40);
ctx.font="bold 18px system-ui";ctx.fillStyle="#e2faff";ctx.fillText(`FACING POLES: ${poles[1]}  +  ${poles[2]}`,(leftX+magW+x)/2,leftY+magH+42);
ctx.font="16px system-ui";ctx.fillStyle="#b6d4e7";ctx.fillText("DRAG ME ↔",x+magW/2,leftY+magH+74);
if(burst>0){for(let i=0;i<14;i++){let a=i*Math.PI/7,rr=(29-burst)*3;ctx.fillStyle=same?"#ffb087":"#65ffdc";ctx.beginPath();ctx.arc(x+magW/2+Math.cos(a)*rr,leftY+magH/2+Math.sin(a)*rr,2.6,0,7);ctx.fill()}burst--}ctx.restore()}
return {canvas,paint,reset,message};
}
function startQuizMagnet(qi){let c=$("quizMagnetCanvas");if(!c)return;let conf=qi===1?"NN":"SN";if(qi===2){conf="SN"}magnetSim=createMagnetPhysics(c,conf);let ctx=c.getContext("2d"),t=0;function frame(){if(!c.isConnected||magnetSim?.canvas!==c)return;ctx.clearRect(0,0,850,420);let bg=ctx.createLinearGradient(0,0,850,420);bg.addColorStop(0,"#173d5b");bg.addColorStop(1,"#061628");ctx.fillStyle=bg;ctx.fillRect(0,0,850,420);magnetSim.paint(ctx,t++);requestAnimationFrame(frame)}frame()}

const ENDPOINT_URL="https://script.google.com/macros/s/AKfycbyAq9DVA2ee7Vtge9vND5PeucQposM_rYbup_nkP4DSvBxAkYmVBDcSeM3FefSy1g9x/exec";
function finalAveragePercentage(){
  // Average of the three actual unit grades; instructor preview never changes these values.
  if(!Array.isArray(s.scores)||s.scores.length<3)return null;
  const grades=s.scores.slice(0,3).map(Number);
  if(grades.some(n=>!Number.isFinite(n)||n<0||n>100))return null;
  return Math.round(grades.reduce((sum,n)=>sum+n,0)/3);
}

function buy(a,price){if(a!=="life"&&s.owned.includes(a)){s.avatar=a;save();shop();return}if(s.candies<price){speak("You need more candies.");return}if(a==="life"&&s.lives>=5){speak("Your lives are already full.");return}s.candies-=price;if(a==="life")s.lives++;else{s.owned.push(a);s.avatar=a}save();shop();speak("Reward unlocked!")}
function avatarPicker(){showModal(`<h2 class="text-2xl font-black mb-4">Choose Your Avatar</h2><div class="flex flex-wrap gap-3">${s.owned.map(a=>`<button class="tile text-4xl" onclick="s.avatar='${a}';save();closeModal()">${a}</button>`).join("")}</div><button class="btn2 mt-4" onclick="closeModal()">Close</button>`)}
// Instructor preview: Ctrl+U cycles through each unit and its certificate.
// This preview does not modify students' scores, rewards, lives or saved progress.
let instructorPreviewStep=-1;
function instructorPreviewNext(){
  closeModal();
  instructorPreviewStep=(instructorPreviewStep+1)%7;
  if(instructorPreviewStep===6){
    makeCertificate("Chapter 13: Magnets",100);
  }else{
    unit=Math.floor(instructorPreviewStep/2);
    if(instructorPreviewStep%2===0){checked=new Set();lab()}
    else makeCertificate(UNITS[unit].title,100);
  }
  const toast=document.createElement("div");
  toast.textContent="INSTRUCTOR PREVIEW • Ctrl + U: Next screen • No progress saved";
  toast.setAttribute("role","status");
  toast.style.cssText="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:90;background:#102c46;color:#eaffff;border:1px solid #56e5cf;border-radius:12px;padding:10px 16px;font:bold 13px Arial;box-shadow:0 6px 20px #0008;pointer-events:none";
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),2400);
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape")closeModal();
  if(e.ctrlKey&&!e.altKey&&!e.metaKey&&e.key.toLowerCase()==="u"){
    e.preventDefault();e.stopPropagation();instructorPreviewNext();
  }
});stats();home();
